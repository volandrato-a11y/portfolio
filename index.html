<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIJA NIAINA CAR SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="nav-container">
        <h1 id="brand-name">Chargement...</h1>
        <div class="menu-burger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <nav id="nav-menu">
            <button onclick="openTab('home')">Accueil</button>
            <button onclick="openTab('cars')">Véhicules</button>
            <button onclick="openTab('radio')">Radio</button>
            <button onclick="openTab('terms')">Conditions</button>
            <button onclick="openTab('contact')" class="nav-special">Contact</button>
        </nav>
    </div>
</header>

<main>
    <section id="home" class="tab active">
        <div class="hero">
            <div class="hero-overlay">
                <h2>Liberté de conduire</h2>
                <p>Location premium sans chauffeur à Antananarivo.</p>
                <div class="hero-btns">
                    <a id="hero-call" href="#" class="btn-call">📞 Appeler</a>
                    <a id="hero-wa" href="#" class="btn-wa">💬 WhatsApp</a>
                </div>
            </div>
        </div>
        
        <div class="why-section">
            <h3>Pourquoi nous ?</h3>
            <p style="color: #666; margin-bottom: 20px;">Cliquez sur une carte pour en savoir plus</p>
            <div class="feat-grid">
                </div>
        </div>
    </section>

    <section id="cars" class="tab">
        <div class="container">
            <h2>Nos Véhicules</h2>
            <div id="cars-grid" class="grid"></div>
        </div>
    </section>

    <section id="radio" class="tab">
        <div class="container">
            <h2>Divertissement WebRadio</h2>
            <div id="radio-grid" class="grid"></div>
        </div>
    </section>

    <section id="terms" class="tab">
        <div class="container">
            <h2>Conditions de Location</h2>
            <div id="conditions-list"></div>
        </div>
    </section>
    
    <section id="contact" class="tab">
        <div class="container">
            <h2>Contactez-nous</h2>
            <form onsubmit="sendWhatsApp(); return false;" class="modern-form">
                <input type="text" id="name" placeholder="Votre Nom" required>
                <select id="subject">
                    <option value="Reservez une voiture">Réservez une voiture</option>
                    <option value="Demande de partenariat">Demande de partenariat</option>
                    <option value="Suggestion">Suggestion</option>
                </select>
                <textarea id="message" placeholder="Votre message..." required></textarea>
                <button type="submit" class="btn-submit">Envoyer via WhatsApp</button>
            </form>
        </div>
    </section>
</main>

<footer id="main-footer"></footer>

<a id="floating-call" href="#" class="floating-btn">
    <i class="fas fa-phone"></i>
</a>

<script src="script.js"></script>
</body>
</html>
