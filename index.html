<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIJA NIAINA CAR SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="nav-container">
        <h1 id="brand-name">RIJA NIAINA</h1>
        <nav id="nav-menu">
            <button onclick="openTab('home')">Accueil</button>
            <button onclick="openTab('cars')">Véhicules</button>
            <button onclick="openTab('terms')">Conditions</button>
            <button onclick="openTab('contact')" class="nav-special">Contact</button>
        </nav>
    </div>
</header>

<main>
    <section id="home" class="tab active">
        <div class="hero">
            <div class="hero-overlay">
                <h2>Liberté de conduire</h2>
                <p>Location premium sans chauffeur à Antananarivo.</p>
                <div class="hero-btns">
                    <a id="hero-call" href="#" class="btn-call">📞 Appeler</a>
                    <a id="hero-wa" href="#" class="btn-wa">💬 WhatsApp</a>
                </div>
            </div>
        </div>
        <div class="container" style="text-align:center;">
            <h2 class="section-title">Pourquoi nous ?</h2>
            <div id="features-grid" class="flip-grid"></div>
        </div>
    </section>

    <section id="cars" class="tab">
        <div class="container">
            <h2>Nos Véhicules</h2>
            <div id="cars-grid" class="grid"></div>
        </div>
    </section>
    
    <section id="terms" class="tab">
        <div class="container">
            <h2>Conditions de Location</h2>
            <p style="text-align:center; margin-bottom:20px;">Cliquez sur une carte pour voir les détails</p>
            <div id="conditions-list" class="flip-grid"></div>
        </div>
    </section>

    <section id="contact" class="tab">
        <div class="container">
            <div class="contact-wrapper">
                <h2>Contactez-nous</h2>
                <form onsubmit="sendWhatsApp(); return false;">
                    <div class="form-row">
                        <div class="form-group"><label>Nom</label><input type="text" id="lname" required></div>
                        <div class="form-group"><label>Prénom</label><input type="text" id="fname" required></div>
                    </div>
                    <div class="form-group"><label>Adresse Mail</label><input type="email" id="email" required></div>
                    <div class="form-group">
                        <label>Motif</label>
                        <select id="subject">
                            <option value="Reservation">Réservation</option>
                            <option value="Demande de devis">Demande de devis</option>
                            <option value="Suggestion">Suggestion</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Message</label><textarea id="message" rows="4" required></textarea></div>
                    <button type="submit" class="btn-submit">Envoyer sur WhatsApp <i class="fab fa-whatsapp"></i></button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer id="main-footer"></footer>
<script src="script.js"></script>
</body>
</html>
