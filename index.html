<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIJA NIAINA CAR SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="nav-container">
        <h1 id="brand-name">Chargement...</h1>
        <div class="menu-burger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <nav id="nav-menu">
            <button onclick="openTab('home')">Accueil</button>
            <button onclick="openTab('cars')">Véhicules</button>
            <button onclick="openTab('radio')">Radio</button>
            <button onclick="openTab('terms')">Conditions</button>
            <button onclick="openTab('contact')" class="nav-special">Contact</button>
        </nav>
    </div>
</header>

<main>
    <section id="home" class="tab active">
        <div class="hero">
            <div class="hero-overlay">
                <h2>Liberté de conduire</h2>
                <p>Location premium sans chauffeur à Antananarivo.</p>
                <div class="hero-btns">
                    <a id="hero-call" href="#" class="btn-call">📞 Appeler</a>
                    <a id="hero-wa" href="#" class="btn-wa">💬 WhatsApp</a>
                </div>
            </div>
        </div>
        <div class="why-section">
            <h3>Pourquoi nous ?</h3>
            <p style="margin-bottom:20px; color:#666;">Cliquez sur une carte pour voir les détails</p>
            <div id="features-grid" class="feat-grid"></div>
        </div>
    </section>

    <section id="cars" class="tab">
        <div class="container">
            <h2>Nos Véhicules</h2>
            <div id="cars-grid" class="grid"></div>
        </div>
    </section>

    <section id="radio" class="tab">
        <div class="container">
            <h2>WebRadio</h2>
            <div id="radio-grid" class="grid"></div>
        </div>
    </section>

    <section id="terms" class="tab">
        <div class="container">
            <h2>Conditions de Location</h2>
            <div id="conditions-list"></div>
        </div>
    </section>
    
    <section id="contact" class="tab">
        <div class="container">
            <div class="contact-wrapper">
                <h2>Contactez-nous</h2>
                <p style="text-align:center; margin-bottom:30px;">Remplissez ce formulaire pour une réservation rapide.</p>
                
                <form onsubmit="sendWhatsApp(); return false;" class="modern-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nom</label>
                            <input type="text" id="lname" placeholder="Ex: RAKOTO" required>
                        </div>
                        <div class="form-group">
                            <label>Prénom</label>
                            <input type="text" id="fname" placeholder="Ex: Jean" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="votre@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Adresse de résidence</label>
                        <input type="text" id="address" placeholder="Lot IVG... Antananarivo" required>
                    </div>

                    <div class="form-group">
                        <label>Objet de la demande</label>
                        <select id="subject">
                            <option value="Réservation">Réserver un véhicule</option>
                            <option value="Informations">Demande d'informations</option>
                            <option value="Partenariat">Partenariat professionnel</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Votre Message</label>
                        <textarea id="message" rows="4" placeholder="Précisez les dates et le modèle souhaité..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Envoyer via WhatsApp <i class="fab fa-whatsapp"></i></button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer id="main-footer"></footer>

<a id="floating-call" href="#" class="floating-btn"><i class="fas fa-phone"></i></a>

<script src="script.js"></script>
</body>
</html>
