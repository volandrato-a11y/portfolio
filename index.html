<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Voiture Antananarivo | Rija Niaina</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="nav-container">
        <h1 id="brand-name">Chargement...</h1>
        <div class="menu-burger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <nav id="nav-menu">
            <button onclick="openTab('home')">Accueil</button>
            <button onclick="openTab('cars')">Véhicules</button>
            <button onclick="openTab('fun')">Divertissement</button>
            <button onclick="openTab('contact')" class="nav-special">Contact</button>
        </nav>
    </div>
</header>

<main>
    <section id="home" class="tab active">
        <div id="hero-banner" class="hero">
            <div class="hero-content">
                <h2 id="hero-title"></h2>
                <p id="hero-slogan" class="slogan"></p>
                <p id="hero-desc" class="description"></p>
                <button class="btn-primary" onclick="openTab('cars')">Voir les voitures</button>
            </div>
        </div>
    </section>

    <section id="cars" class="tab">
        <div class="container">
            <div id="cars-grid" class="cars-grid"></div>
        </div>
    </section>

    <section id="fun" class="tab">
        <div class="container">
            <h2 id="fun-title" style="text-align:center; margin-bottom:30px;"></h2>
            <div id="radios-grid" class="radios-grid"></div>
        </div>
    </section>

    <section id="contact" class="tab">
        <div class="container">
            <div class="contact-wrapper">
                <h2 id="contact-title"></h2>
                <form id="dynamic-form" onsubmit="sendWhatsApp(event)"></form>
            </div>
        </div>
    </section>
</main>

<footer id="main-footer"></footer>

<a id="fab-call" href="#" class="fab-call"><i class="fas fa-phone-alt"></i></a>

<script src="script.js"></script>
</body>
</html>
