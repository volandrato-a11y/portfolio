<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Voiture Antananarivo | Rija Niaina Car Services Madagascar</title>
    <meta name="description" content="Louez votre voiture à Antananarivo au meilleur prix. Large choix de véhicules : SUV, Berlines et 4x4. Service fiable, sans chauffeur ou avec chauffeur à Madagascar.">
    <meta name="keywords" content="location voiture antananarivo, louer voiture madagascar, 4x4 madagascar, transport tana, Rija Niaina Car Services">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="nav-container">
        <h1 id="brand-name">RIJA NIAINA <span>SERVICES</span></h1>
        <div class="menu-burger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <nav id="nav-menu">
            <button onclick="openTab('home')">Accueil</button>
            <button onclick="openTab('cars')">Nos Véhicules</button>
            <button onclick="openTab('fun')">Divertissement</button>
            <button onclick="openTab('terms')">Conditions</button>
            <button onclick="openTab('contact')">Réservation</button>
        </nav>
    </div>
</header>

<main>
    <section id="home" class="tab active">
        <div class="hero">
            <div class="hero-content">
                <h2>Votre liberté de mouvement à Madagascar</h2>
                <p>Des véhicules confortables pour vos déplacements professionnels et touristiques.</p>
                <div class="hero-btns">
                    <a id="hero-call" class="btn"><i class="fas fa-phone"></i> Appeler</a>
                    <a id="hero-wa" class="btn wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                </div>
            </div>
        </div>
        <div class="container" id="features-grid"></div>
    </section>

    <section id="cars" class="tab">
        <div class="container">
            <h2 class="section-title">Notre Flotte de Véhicules</h2>
            <div id="cars-grid" class="cars-container"></div>
        </div>
    </section>

    <section id="fun" class="tab">
        <div class="container">
            <h2>Radios & Playlists</h2>
            <div id="radios-grid" class="radio-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px;"></div>
            <div class="playlists">
                <a id="play-yt" class="play-btn yt"><i class="fab fa-youtube"></i> YouTube</a>
                <a id="play-sp" class="play-btn sp"><i class="fab fa-spotify"></i> Spotify</a>
                <a id="play-dz" class="play-btn dz"><i class="fab fa-deezer"></i> Deezer</a>
            </div>
        </div>
    </section>

    <section id="terms" class="tab">
        <div class="container">
            <h2 class="section-title">Conditions de Location</h2>
            <div id="conditions-list" class="flip-grid"></div>
        </div>
    </section>

    <section id="contact" class="tab">
        <div class="container">
            <div class="contact-wrapper">
                <h2>Demande de Réservation</h2>
                <form onsubmit="sendWhatsApp(); return false;">
                    <div class="form-row">
                        <div class="form-group"><label>Nom</label><input type="text" id="lname" required></div>
                        <div class="form-group"><label>Prénom</label><input type="text" id="fname" required></div>
                    </div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                    <div class="form-group">
                        <label>Motif</label>
                        <select id="subject">
                            <option value="Reservation">Réservation</option>
                            <option value="Devis">Demande de devis</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Détails (Date, durée...)</label><textarea id="message" rows="3" required></textarea></div>
                    <button type="submit" class="btn-submit">Envoyer sur WhatsApp <i class="fab fa-whatsapp"></i></button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer id="main-footer"></footer>
<script src="script.js"></script>
</body>
</html>
